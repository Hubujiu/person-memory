# Merge the relevant keys into ~/.hermes/config.yaml.
# Exact provider/model values are intentionally left to the user's existing Hermes setup.

skills:
  config:
    person_memory:
      db_path: ~/.hermes/person-memory/memory.db

cron:
  # Keep unattended jobs stable if your Hermes release supports this guard.
  model_drift_guard: true

# Optional short slash aliases. Hermes forwards the user's trailing arguments
# to /person-memory, e.g. `/pm 她说她不吃香菜`.
quick_commands:
  pm:
    type: alias
    target: /person-memory
  remember:
    type: alias
    target: /person-memory
  person:
    type: alias
    target: /person-memory
